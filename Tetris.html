<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tetris</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg-color: #1a1a2e;
            --text-color: #e94560;
            --main-text-color: #fff;
            --panel-bg: #2b2e4a;
            --button-bg: #e94560;
            --button-hover: #ff6f8a;
            --border-color: #4a506e;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--main-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            overflow: auto;
        }

        .game-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        canvas {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            touch-action: none; /* Prevents default touch actions like scrolling */
        }

        .info-panel {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-info-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .game-info-box h2 {
            margin: 0 0 10px 0;
            color: var(--text-color);
            font-size: 1rem;
        }
        .game-info-box p {
            margin: 0;
            font-size: 1.2rem;
            color: var(--main-text-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--button-bg);
            color: var(--main-text-color);
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #9c2a3e;
            transition: all 0.1s ease-in-out;
            font-size: 0.8rem;
        }

        .button:active {
            box-shadow: none;
            transform: translateY(5px);
        }

        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--text-color);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5rem;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 100;
        }

        .message-box.visible {
            visibility: visible;
            opacity: 1;
        }

        .touch-controls {
            display: none; /* Hide by default */
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            gap: 10px;
        }

        .touch-button {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            width: 80px;
            height: 80px;
        }

        .d-pad-container {
            display: grid;
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
            gap: 5px;
        }

        .d-pad-button {
            grid-area: var(--direction);
            width: 60px;
            height: 60px;
            background-color: var(--button-bg);
            color: var(--main-text-color);
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 0 #9c2a3e;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        .d-pad-button:active {
            box-shadow: none;
            transform: translateY(4px);
        }
        .d-pad-button.up { --direction: up; }
        .d-pad-button.down { --direction: down; }
        .d-pad-button.left { --direction: left; }
        .d-pad-button.right { --direction: right; }


        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .info-panel {
                width: 100%;
                max-width: 400px;
            }
            .touch-controls {
                display: flex; /* Show touch controls on mobile */
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="info-panel">
            <div class="game-info-box">
                <h2>Score</h2>
                <p id="scoreDisplay">0</p>
            </div>
            <div class="game-info-box">
                <h2>Lines</h2>
                <p id="linesDisplay">0</p>
            </div>
            <div class="game-info-box">
                <h2>Level</h2>
                <p id="levelDisplay">1</p>
            </div>
            <div class="controls">
                <button id="startButton" class="button">Start Game</button>
                <button id="aiToggleButton" class="button">Toggle AI</button>
            </div>
            <!-- Touch controls section -->
            <div class="touch-controls">
                <div class="d-pad-container">
                    <button class="d-pad-button up" data-action="rotate">⇧</button>
                    <button class="d-pad-button left" data-action="left">⇦</button>
                    <button class="d-pad-button right" data-action="right">⇨</button>
                    <button class="d-pad-button down" data-action="drop">⇩</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="messageBox" class="message-box"></div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const linesDisplay = document.getElementById('linesDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const startButton = document.getElementById('startButton');
            const aiToggleButton = document.getElementById('aiToggleButton');
            const messageBox = document.getElementById('messageBox');

            const COLS = 10;
            const ROWS = 20;
            const BLOCK_SIZE = 30;
            let board = [];
            let score = 0;
            let lines = 0;
            let level = 1;
            let currentPiece;
            let nextPiece;
            let dropCounter = 0;
            let dropInterval = 600;
            let lastTime = 0;
            let isRunning = false;
            let isPaused = false;
            let aiOn = false;
            let aiDropTimeout = null;
            let lastAITime = 0;
            // The AI's speed has been changed from 500ms to 600ms.
            // This is the key line that controls the AI speed.
            const aiMoveDelay = 1000; // Time in milliseconds between AI moves

            
            // Define the tetrominoes and their colors
            const PIECES = [
                { shape: [[1,1,1,1]], color: '#00ffff' }, // I
                { shape: [[1,1],[1,1]], color: '#ffff00' }, // O
                { shape: [[0,1,0],[1,1,1]], color: '#800080' }, // T
                { shape: [[1,1,0],[0,1,1]], color: '#ff0000' }, // S
                { shape: [[0,1,1],[1,1,0]], color: '#00ff00' }, // Z
                { shape: [[1,0,0],[1,1,1]], color: '#ffa500' }, // L
                { shape: [[0,0,1],[1,1,1]], color: '#0000ff' }, // J
            ];

            // Resize canvas to fit
            const resizeCanvas = () => {
                const gameContainer = document.querySelector('.game-container');
                const availableHeight = window.innerHeight - 40; // 40px for padding
                const availableWidth = window.innerWidth - 40;

                const panelWidth = document.querySelector('.info-panel').offsetWidth;
                const canvasWidth = Math.min(COLS * BLOCK_SIZE, availableWidth - panelWidth - 40);
                const canvasHeight = Math.min(ROWS * BLOCK_SIZE, availableHeight);

                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                drawBoard();
            };

            // Set up board and game state
            const init = () => {
                canvas.width = COLS * BLOCK_SIZE;
                canvas.height = ROWS * BLOCK_SIZE;

                board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
                score = 0;
                lines = 0;
                level = 1;
                updateDisplay();
                spawnPiece();
                nextPiece = getRandomPiece();
                drawNextPiece();
                drawBoard();
                if (aiOn) {
                    aiToggleButton.textContent = 'AI ON';
                } else {
                    aiToggleButton.textContent = 'AI OFF';
                }
            };
            
            const showMessage = (text, duration = 2000) => {
                messageBox.textContent = text;
                messageBox.classList.add('visible');
                setTimeout(() => {
                    messageBox.classList.remove('visible');
                }, duration);
            };

            const getRandomPiece = () => {
                const randomIndex = Math.floor(Math.random() * PIECES.length);
                const piece = PIECES[randomIndex];
                return {
                    shape: piece.shape,
                    color: piece.color,
                    x: Math.floor(COLS / 2) - Math.floor(piece.shape[0].length / 2),
                    y: 0
                };
            };
            
            const spawnPiece = () => {
                if (!nextPiece) {
                    currentPiece = getRandomPiece();
                } else {
                    currentPiece = nextPiece;
                }
                nextPiece = getRandomPiece();

                if (!isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y)) {
                    gameOver();
                    return;
                }
                drawNextPiece();
            };

            const isValidMove = (shape, x, y) => {
                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[row].length; col++) {
                        if (shape[row][col] === 1) {
                            const newX = x + col;
                            const newY = y + row;
                            if (newX < 0 || newX >= COLS || newY >= ROWS || (board[newY] && board[newY][newX] !== 0)) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            };

            const drawBlock = (x, y, color) => {
                ctx.fillStyle = color;
                ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                ctx.strokeStyle = '#2b2e4a';
                ctx.lineWidth = 2;
                ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            };

            const drawBoard = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        if (board[row][col] !== 0) {
                            drawBlock(col, row, board[row][col]);
                        }
                    }
                }
                if (currentPiece) {
                    drawPiece(currentPiece);
                }
            };

            const drawPiece = (piece) => {
                for (let row = 0; row < piece.shape.length; row++) {
                    for (let col = 0; col < piece.shape[row].length; col++) {
                        if (piece.shape[row][col] === 1) {
                            drawBlock(piece.x + col, piece.y + row, piece.color);
                        }
                    }
                }
            };
            
            const drawNextPiece = () => {
                // Not implemented to keep it simple, but this is where you'd draw the next piece in a side panel.
                // You would need another canvas or div for this.
            };

            const lockPiece = () => {
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col] === 1) {
                            board[currentPiece.y + row][currentPiece.x + col] = currentPiece.color;
                        }
                    }
                }
                checkLines();
                spawnPiece();
            };

            const checkLines = () => {
                let linesCleared = 0;
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (board[row].every(cell => cell !== 0)) {
                        board.splice(row, 1);
                        board.unshift(Array(COLS).fill(0));
                        linesCleared++;
                        row++; // Re-check the new row at the same index
                    }
                }
                if (linesCleared > 0) {
                    updateScore(linesCleared);
                }
            };

            const updateScore = (linesCleared) => {
                const lineScores = [0, 40, 100, 300, 1200]; // 1, 2, 3, 4 lines
                score += lineScores[linesCleared] * level;
                lines += linesCleared;
                level = Math.floor(lines / 10) + 1;
                dropInterval = 1000 / level;
                updateDisplay();
            };

            const updateDisplay = () => {
                scoreDisplay.textContent = score;
                linesDisplay.textContent = lines;
                levelDisplay.textContent = level;
            };

            const gameOver = () => {
                isRunning = false;
                showMessage("Game Over!");
                startButton.textContent = "Start New Game";
            };

            const dropPiece = () => {
                const newY = currentPiece.y + 1;
                if (isValidMove(currentPiece.shape, currentPiece.x, newY)) {
                    currentPiece.y = newY;
                } else {
                    lockPiece();
                }
            };

            // AI Logic
            const getBestMove = () => {
                let bestScore = -Infinity;
                let bestMove = null;

                const originalPiece = JSON.parse(JSON.stringify(currentPiece));

                // Loop through all rotations
                for (let r = 0; r < 4; r++) {
                    // Loop through all possible x positions
                    for (let x = -1; x < COLS; x++) {
                        const tempPiece = JSON.parse(JSON.stringify(originalPiece));
                        tempPiece.shape = originalPiece.shape;
                        for(let i = 0; i < r; i++) {
                            tempPiece.shape = rotate(tempPiece.shape);
                        }
                        tempPiece.x = x;

                        if (!isValidMove(tempPiece.shape, tempPiece.x, tempPiece.y)) {
                            continue;
                        }

                        // Drop piece to the bottom
                        let dropY = tempPiece.y;
                        while (isValidMove(tempPiece.shape, tempPiece.x, dropY + 1)) {
                            dropY++;
                        }
                        tempPiece.y = dropY;

                        // Create a temporary board with the dropped piece
                        const tempBoard = JSON.parse(JSON.stringify(board));
                        for (let row = 0; row < tempPiece.shape.length; row++) {
                            for (let col = 0; col < tempPiece.shape[row].length; col++) {
                                if (tempPiece.shape[row][col] === 1) {
                                    if (tempBoard[tempPiece.y + row] && tempBoard[tempPiece.y + row][tempPiece.x + col] === 0) {
                                        // Fixed the typo here
                                        tempBoard[tempPiece.y + row][tempPiece.x + col] = 1;
                                    }
                                }
                            }
                        }

                        // Calculate score for this state
                        const score = calculateHeuristic(tempBoard);
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { x: tempPiece.x, rotation: r, finalY: tempPiece.y };
                        }
                    }
                }
                return bestMove;
            };

            const rotate = (shape) => {
                const newShape = Array.from({ length: shape[0].length }, () => Array(shape.length).fill(0));
                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[0].length; col++) {
                        newShape[col][shape.length - 1 - row] = shape[row][col];
                    }
                }
                return newShape;
            };

            const calculateHeuristic = (board) => {
                // Heuristic weights, tuned for a good AI
                const WEIGHTS = {
                    completedLines: 1.5,
                    holes: -2.0,
                    aggregateHeight: -0.5,
                    bumpiness: -0.5
                };

                let completedLines = 0;
                let holes = 0;
                let aggregateHeight = 0;
                let columnHeights = new Array(COLS).fill(0);
                let bumpiness = 0;

                for (let col = 0; col < COLS; col++) {
                    let topFound = false;
                    let height = 0;
                    for (let row = 0; row < ROWS; row++) {
                        if (board[row][col] !== 0) {
                            if (!topFound) {
                                height = ROWS - row;
                                topFound = true;
                            }
                        } else if (topFound) {
                            holes++;
                        }
                    }
                    columnHeights[col] = height;
                    aggregateHeight += height;
                }

                for (let row = 0; row < ROWS; row++) {
                    if (board[row].every(cell => cell !== 0)) {
                        completedLines++;
                    }
                }

                for (let i = 0; i < COLS - 1; i++) {
                    bumpiness += Math.abs(columnHeights[i] - columnHeights[i+1]);
                }
                
                return (
                    (completedLines * WEIGHTS.completedLines) +
                    (holes * WEIGHTS.holes) +
                    (aggregateHeight * WEIGHTS.aggregateHeight) +
                    (bumpiness * WEIGHTS.bumpiness)
                );
            };

            const applyAIMove = () => {
                if (!isRunning || isPaused || !aiOn) return;

                const bestMove = getBestMove();
                if (bestMove) {
                    // First, rotate the piece to the desired rotation
                    for (let r = 0; r < bestMove.rotation; r++) {
                        currentPiece.shape = rotate(currentPiece.shape);
                    }

                    // Move horizontally to the desired x position
                    currentPiece.x = bestMove.x;

                    // Drop the piece instantly
                    currentPiece.y = bestMove.finalY;

                    lockPiece();
                }
            };
            
            // Main game loop
            const gameLoop = (currentTime) => {
                if (!isRunning) return;

                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                if (!isPaused) {
                    if (aiOn) {
                        const now = Date.now();
                        // This is the key line that controls the AI speed.
                        // I've increased the delay from 200ms to 500ms.
                        if (now - lastAITime > aiMoveDelay) { 
                            applyAIMove();
                            lastAITime = now;
                        }
                    } else {
                        dropCounter += deltaTime;
                        if (dropCounter > dropInterval) {
                            dropPiece();
                            dropCounter = 0;
                        }
                    }
                    drawBoard();
                }
                requestAnimationFrame(gameLoop);
            };

            // Event Listeners
            document.addEventListener('keydown', (e) => {
                if (!isRunning || isPaused || aiOn) return;
                
                const piece = currentPiece;
                switch (e.key) {
                    case 'ArrowLeft':
                        if (isValidMove(piece.shape, piece.x - 1, piece.y)) piece.x--;
                        break;
                    case 'ArrowRight':
                        if (isValidMove(piece.shape, piece.x + 1, piece.y)) piece.x++;
                        break;
                    case 'ArrowDown':
                        if (isValidMove(piece.shape, piece.x, piece.y + 1)) {
                            piece.y++;
                        } else {
                            lockPiece();
                        }
                        break;
                    case 'ArrowUp':
                        const rotatedShape = rotate(piece.shape);
                        if (isValidMove(rotatedShape, piece.x, piece.y)) piece.shape = rotatedShape;
                        break;
                    case ' ': // Spacebar to drop instantly
                        while (isValidMove(piece.shape, piece.x, piece.y + 1)) {
                            piece.y++;
                        }
                        lockPiece();
                        break;
                }
                drawBoard();
            });

            // Touch controls
            const touchControls = document.querySelectorAll('.d-pad-button');
            touchControls.forEach(button => {
                button.addEventListener('click', (e) => {
                    if (!isRunning || isPaused || aiOn) return;
                    const action = e.currentTarget.dataset.action;
                    const piece = currentPiece;
                    switch(action) {
                        case 'rotate':
                            const rotatedShape = rotate(piece.shape);
                            if (isValidMove(rotatedShape, piece.x, piece.y)) piece.shape = rotatedShape;
                            break;
                        case 'left':
                            if (isValidMove(piece.shape, piece.x - 1, piece.y)) piece.x--;
                            break;
                        case 'right':
                            if (isValidMove(piece.shape, piece.x + 1, piece.y)) piece.x++;
                            break;
                        case 'drop':
                            while (isValidMove(piece.shape, piece.x, piece.y + 1)) {
                                piece.y++;
                            }
                            lockPiece();
                            break;
                    }
                    drawBoard();
                });
            });


            startButton.addEventListener('click', () => {
                if (isRunning) {
                    isPaused = !isPaused;
                    startButton.textContent = isPaused ? "Resume Game" : "Pause Game";
                } else {
                    isRunning = true;
                    init();
                    startButton.textContent = "Pause Game";
                    requestAnimationFrame(gameLoop);
                }
            });

            aiToggleButton.addEventListener('click', () => {
                aiOn = !aiOn;
                aiToggleButton.textContent = aiOn ? 'AI ON' : 'AI OFF';
            });
            
            // Initial call to set up the game
            init();
        };
    </script>
</body>
</html>
