<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tetris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        canvas {
            border: 2px solid #4a5568;
            border-radius: 0.5rem;
        }
        .touch-button {
            transition: all 0.1s ease-in-out;
        }
        .touch-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold text-center mb-6 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">AI Tetris</h1>
        
        <div class="flex flex-col md:flex-row justify-center gap-6">
            <!-- Game Info Panel -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-full md:w-64 order-2 md:order-1">
                <h2 class="text-2xl font-semibold mb-4 text-center">Stats</h2>
                <div class="space-y-4 text-lg">
                    <div>
                        <p class="font-bold">Score:</p>
                        <p id="score" class="text-2xl text-cyan-400">0</p>
                    </div>
                    <div>
                        <p class="font-bold">Lines:</p>
                        <p id="lines" class="text-2xl text-cyan-400">0</p>
                    </div>
                    <div>
                        <p class="font-bold">Level:</p>
                        <p id="level" class="text-2xl text-cyan-400">1</p>
                    </div>
                </div>
                <h2 class="text-2xl font-semibold mt-8 mb-4 text-center">Next Piece</h2>
                <div class="flex justify-center items-center bg-gray-900 rounded-md h-32">
                    <canvas id="next-piece-canvas" width="120" height="120"></canvas>
                </div>
            </div>

            <!-- Game Board -->
            <div class="flex-shrink-0 order-1 md:order-2">
                <canvas id="tetris-canvas"></canvas>
            </div>

            <!-- Controls and AI Panel -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-full md:w-64 order-3 md:order-3">
                 <h2 class="text-2xl font-semibold mb-4 text-center">Controls</h2>
                 <div class="flex flex-col gap-3">
                    <button id="start-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors">Start Game</button>
                    <button id="reset-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors">Reset</button>
                    <button id="ai-btn" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors">Enable AI</button>
                </div>
                <div class="mt-6 text-sm text-gray-400 hidden md:block">
                    <p><span class="font-bold text-white">Left/Right:</span> Move</p>
                    <p><span class="font-bold text-white">Down:</span> Soft Drop</p>
                    <p><span class="font-bold text-white">Up:</span> Rotate</p>
                    <p><span class="font-bold text-white">Space:</span> Hard Drop</p>
                </div>
            </div>
        </div>
        
        <!-- On-screen controls for mobile -->
        <div class="md:hidden mt-6 w-full max-w-sm mx-auto">
            <div class="grid grid-cols-3 gap-2 items-center">
                <button id="move-left-btn" class="touch-button bg-gray-700 p-4 rounded-lg text-2xl">←</button>
                <button id="rotate-btn" class="touch-button bg-gray-700 p-4 rounded-lg text-2xl">↻</button>
                <button id="move-right-btn" class="touch-button bg-gray-700 p-4 rounded-lg text-2xl">→</button>
            </div>
            <div class="grid grid-cols-1 gap-2 mt-2">
                <button id="soft-drop-btn" class="touch-button bg-gray-700 p-4 rounded-lg text-2xl">↓</button>
                <button id="hard-drop-btn" class="touch-button bg-gray-700 p-4 rounded-lg text-2xl font-bold">DROP</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('tetris-canvas');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const levelEl = document.getElementById('level');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const aiBtn = document.getElementById('ai-btn');

        // Game constants
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const COLORS = [
            null,
            '#FF0D72', // T
            '#0DC2FF', // I
            '#0DFF72', // O
            '#F538FF', // L
            '#FF8E0D', // J
            '#FFE138', // S
            '#3877FF'  // Z
        ];
        const SHAPES = [
            [], // Empty
            [[1, 1, 1], [0, 1, 0]], // T
            [[2, 2, 2, 2]], // I
            [[3, 3], [3, 3]], // O
            [[4, 0, 0], [4, 4, 4]], // L
            [[0, 0, 5], [5, 5, 5]], // J
            [[0, 6, 6], [6, 6, 0]], // S
            [[7, 7, 0], [0, 7, 7]]  // Z
        ];

        // Game state
        let board = [];
        let currentPiece;
        let nextPiece;
        let score = 0;
        let lines = 0;
        let level = 1;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameOver = true;
        let isAiActive = false;
        let animationFrameId;

        // Setup canvases
        canvas.width = COLS * BLOCK_SIZE;
        canvas.height = ROWS * BLOCK_SIZE;
        context.scale(BLOCK_SIZE, BLOCK_SIZE);
        nextContext.scale(BLOCK_SIZE, BLOCK_SIZE);

        // --- Game Logic ---

        function createBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        }

        function createPiece(type) {
            const matrix = SHAPES[type];
            return {
                matrix: matrix,
                type: type,
                pos: { x: Math.floor(COLS / 2) - Math.floor(matrix[0].length / 2), y: 0 }
            };
        }

        function getRandomPiece() {
            const types = 'TIOLJSZ';
            const randType = types[Math.floor(Math.random() * types.length)];
            const typeIndex = 'TIOLJSZ'.indexOf(randType) + 1;
            return createPiece(typeIndex);
        }
        
        function resetGame() {
            board = createBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            isGameOver = false;
            currentPiece = getRandomPiece();
            nextPiece = getRandomPiece();
            updateScoreboard();
            if (!animationFrameId) {
                gameLoop(0);
            }
        }

        function playerMove(offset) {
            currentPiece.pos.x += offset;
            if (checkCollision()) {
                currentPiece.pos.x -= offset;
            }
        }

        function playerRotate() {
            const originalPos = currentPiece.pos.x;
            let offset = 1;
            rotateMatrix(currentPiece.matrix);
            while (checkCollision()) {
                currentPiece.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > currentPiece.matrix[0].length) {
                    rotateMatrix(currentPiece.matrix); // Rotate back
                    currentPiece.pos.x = originalPos;
                    return;
                }
            }
        }

        function rotateMatrix(matrix) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            matrix.forEach(row => row.reverse());
        }
        
        function playerDrop() {
            currentPiece.pos.y++;
            if (checkCollision()) {
                currentPiece.pos.y--;
                mergePiece();
                spawnNewPiece();
            }
            dropCounter = 0;
        }
        
        function hardDrop() {
            while (!checkCollision()) {
                currentPiece.pos.y++;
            }
            currentPiece.pos.y--;
            mergePiece();
            spawnNewPiece();
        }

        function checkCollision() {
            const { matrix, pos } = currentPiece;
            for (let y = 0; y < matrix.length; y++) {
                for (let x = 0; x < matrix[y].length; x++) {
                    if (matrix[y][x] !== 0 &&
                        (board[y + pos.y] && board[y + pos.y][x + pos.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function mergePiece() {
            currentPiece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        board[y + currentPiece.pos.y][x + currentPiece.pos.x] = value;
                    }
                });
            });
        }

        function spawnNewPiece() {
            currentPiece = nextPiece;
            nextPiece = getRandomPiece();
            if (checkCollision()) {
                isGameOver = true;
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                drawGameOver();
            }
        }

        function clearLines() {
            let linesCleared = 0;
            outer: for (let y = ROWS - 1; y >= 0; y--) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                y++;
                linesCleared++;
            }
            
            if (linesCleared > 0) {
                lines += linesCleared;
                score += [0, 100, 300, 500, 800][linesCleared] * level;
                if (lines >= level * 10) {
                    level++;
                    dropInterval *= 0.9;
                }
                updateScoreboard();
            }
        }
        
        function updateScoreboard() {
            scoreEl.innerText = score;
            linesEl.innerText = lines;
            levelEl.innerText = level;
        }

        // --- Drawing ---
        
        function draw() {
            context.fillStyle = '#1a202c';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawBoard();
            drawPiece(currentPiece, context);
            drawNextPiece();
        }

        function drawBoard() {
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = COLORS[value];
                        context.fillRect(x, y, 1, 1);
                    }
                });
            });
        }
        
        function drawPiece(piece, ctx) {
            ctx.fillStyle = COLORS[piece.type];
            piece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillRect(x + piece.pos.x, y + piece.pos.y, 1, 1);
                    }
                });
            });
        }
        
        function drawNextPiece() {
            nextContext.fillStyle = '#1a202c';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            const piece = nextPiece;
            const offsetX = (nextCanvas.width / BLOCK_SIZE - piece.matrix[0].length) / 2;
            const offsetY = (nextCanvas.height / BLOCK_SIZE - piece.matrix.length) / 2;
            const tempPiece = {
                ...piece,
                pos: { x: offsetX, y: offsetY }
            };
            drawPiece(tempPiece, nextContext);
        }

        function drawGameOver() {
            context.fillStyle = 'rgba(0, 0, 0, 0.75)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = '2px Inter';
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.fillText('GAME OVER', COLS / 2, ROWS / 2);
        }

        // --- AI Logic ---
        function findBestMove() {
            let bestScore = -Infinity;
            let bestMove = {};

            const piece = currentPiece;

            for (let rotation = 0; rotation < 4; rotation++) {
                let tempPiece = JSON.parse(JSON.stringify(piece));
                for(let i = 0; i < rotation; i++) rotateMatrix(tempPiece.matrix);

                for (let x = -2; x < COLS; x++) {
                    let tempBoard = JSON.parse(JSON.stringify(board));
                    tempPiece.pos.x = x;
                    
                    // Drop the piece
                    tempPiece.pos.y = 0;
                    while (!checkCollisionWithBoard(tempPiece, tempBoard)) {
                        tempPiece.pos.y++;
                    }
                    tempPiece.pos.y--;

                    if (tempPiece.pos.y < 0) continue; // Invalid move

                    // Merge piece into temp board
                    mergePieceToBoard(tempPiece, tempBoard);
                    
                    // Score the board state
                    const score = calculateScore(tempBoard);

                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = {
                            rotation: rotation,
                            x: x,
                            y: tempPiece.pos.y
                        };
                    }
                }
            }
            return bestMove;
        }
        
        function calculateScore(boardState) {
            const aggregateHeight = getAggregateHeight(boardState);
            const completedLines = getCompletedLines(boardState);
            const holes = getHoles(boardState);
            const bumpiness = getBumpiness(boardState);

            // Weights for each heuristic
            const weightHeight = -0.510066;
            const weightLines = 0.760666;
            const weightHoles = -0.35663;
            const weightBumpiness = -0.184483;

            return (aggregateHeight * weightHeight) + 
                   (completedLines * weightLines) + 
                   (holes * weightHoles) + 
                   (bumpiness * weightBumpiness);
        }
        
        function getAggregateHeight(boardState) {
            let totalHeight = 0;
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] !== 0) {
                        totalHeight += (ROWS - r);
                        break;
                    }
                }
            }
            return totalHeight;
        }

        function getCompletedLines(boardState) {
            let lines = 0;
            for (let r = 0; r < ROWS; r++) {
                if (boardState[r].every(cell => cell !== 0)) {
                    lines++;
                }
            }
            return lines;
        }

        function getHoles(boardState) {
            let holes = 0;
            for (let c = 0; c < COLS; c++) {
                let blockFound = false;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] !== 0) {
                        blockFound = true;
                    } else if (blockFound) {
                        holes++;
                    }
                }
            }
            return holes;
        }

        function getBumpiness(boardState) {
            let bumpiness = 0;
            let columnHeights = [];
            for (let c = 0; c < COLS; c++) {
                let height = 0;
                for (let r = 0; r < ROWS; r++) {
                    if (boardState[r][c] !== 0) {
                        height = ROWS - r;
                        break;
                    }
                }
                columnHeights.push(height);
            }
            for (let i = 0; i < columnHeights.length - 1; i++) {
                bumpiness += Math.abs(columnHeights[i] - columnHeights[i+1]);
            }
            return bumpiness;
        }
        
        function checkCollisionWithBoard(piece, boardState) {
            const { matrix, pos } = piece;
            for (let y = 0; y < matrix.length; y++) {
                for (let x = 0; x < matrix[y].length; x++) {
                    if (matrix[y][x] !== 0 &&
                        (boardState[y + pos.y] && boardState[y + pos.y][x + pos.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function mergePieceToBoard(piece, boardState) {
            piece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        boardState[y + piece.pos.y][x + piece.pos.x] = value;
                    }
                });
            });
        }

        let aiMoveCounter = 0;
        function executeAiMove() {
            if (isAiActive && !isGameOver) {
                const bestMove = findBestMove();
                
                // Rotate
                for(let i = 0; i < bestMove.rotation; i++) {
                    playerRotate();
                }

                // Move horizontally
                currentPiece.pos.x = bestMove.x;
                if (checkCollision()) { // Correct if out of bounds
                    currentPiece.pos.x = Math.max(0, Math.min(COLS - currentPiece.matrix[0].length, bestMove.x));
                }

                // Hard drop
                hardDrop();
            }
        }
        
        // --- Game Loop ---

        function gameLoop(time = 0) {
            if (isGameOver) {
                return;
            }

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (isAiActive) {
                // AI plays at a fixed speed to be watchable
                if (dropCounter > 100) {
                    executeAiMove();
                    dropCounter = 0;
                }
            } else {
                if (dropCounter > dropInterval) {
                    playerDrop();
                }
            }

            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        
        document.addEventListener('keydown', event => {
            if (isGameOver || isAiActive) return;

            if (event.key === 'ArrowLeft') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight') {
                playerMove(1);
            } else if (event.key === 'ArrowDown') {
                playerDrop();
            } else if (event.key === 'ArrowUp') {
                playerRotate();
            } else if (event.key === ' ') {
                event.preventDefault(); // Prevent page scroll
                hardDrop();
            }
        });
        
        startBtn.addEventListener('click', () => {
            if (isGameOver) {
                resetGame();
            }
        });
        
        resetBtn.addEventListener('click', () => {
             if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            isGameOver = true;
            board = createBoard();
            draw();
        });

        aiBtn.addEventListener('click', () => {
            isAiActive = !isAiActive;
            aiBtn.innerText = isAiActive ? 'Disable AI' : 'Enable AI';
            aiBtn.classList.toggle('bg-purple-500', !isAiActive);
            aiBtn.classList.toggle('hover:bg-purple-600', !isAiActive);
            aiBtn.classList.toggle('bg-blue-500', isAiActive);
            aiBtn.classList.toggle('hover:bg-blue-600', isAiActive);
        });

        // Touch controls
        document.getElementById('move-left-btn').addEventListener('click', () => !isAiActive && playerMove(-1));
        document.getElementById('move-right-btn').addEventListener('click', () => !isAiActive && playerMove(1));
        document.getElementById('rotate-btn').addEventListener('click', () => !isAiActive && playerRotate());
        document.getElementById('soft-drop-btn').addEventListener('click', () => !isAiActive && playerDrop());
        document.getElementById('hard-drop-btn').addEventListener('click', () => !isAiActive && hardDrop());

        // Initial draw
        board = createBoard();
        draw();
    </script>
</body>
</html>
